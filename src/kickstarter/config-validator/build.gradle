buildscript {
  repositories {
    jcenter()
    maven {
      url 'https://plugins.gradle.org/m2/'
    }
    maven {
      url "https://repo.clarivate.io/artifactory/central"
    }
  }

  dependencies {
    classpath 'com.github.node-gradle:gradle-node-plugin:1.5.3'
  }
}


apply plugin: 'com.github.node-gradle.node'

node {
  version = "12.13.0"
  download = true
}


logging.captureStandardOutput LogLevel.INFO

task wickedConfigSchemaValidator( type: NodeTask,dependsOn: 'installPackagesConfigValidator' ) {
  script = file("${project.projectDir}/validate.js")
  args = ["${project.projectDir}/../",System.getenv("pullRequestId")]
}
task installPackagesConfigValidator(type: NpmTask) {
  args = ['install','--production']
  workingDir = file("${project.projectDir}/config-validator/")
}